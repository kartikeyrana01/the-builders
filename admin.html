<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="admin.js"></script>
</head>
<body>
  <div class="admin-container" style="max-width:800px;margin:auto;padding:2rem;">
    <section id="login-section">
      <h2>Admin Login</h2>
      <form id="admin-login">
        <div class="input-group">
          <label for="admin-email">Email</label>
          <input type="email" id="admin-email" placeholder="admin@example.com" required>
        </div>
        <div class="input-group">
          <label for="admin-pass">Password</label>
          <input type="password" id="admin-pass" placeholder="123456789" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p id="login-error" style="color:#f87171;display:none;">Invalid credentials</p>
    </section>
    <section id="dashboard-section" style="display:none;">
      <h2>Contact Form Submissions</h2>
      <button id="logout-btn" class="btn-secondary" style="margin-bottom:1rem;">Logout</button>
      <div id="messages"></div>
    </section>
  </div>
</body>
</html>
